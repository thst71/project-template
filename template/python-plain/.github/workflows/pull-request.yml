# Pull request workflow, from the agent-skills release skill template (release/pull-request.yml).
# Runs for every commit of a pull request, not for branch pushes without one.
name: pull-request

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run poe check
      - run: uv run poe blackbox
