# Pull request workflow, from the agent-skills release skill template (release/pull-request.yml).
# Runs for every commit of a pull request, not for branch pushes without one.
name: pull-request

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:blackbox
