# Pull request workflow, from the agent-skills release skill template (release/pull-request.yml).
# Runs for every commit of a pull request, not for branch pushes without one.
name: pull-request

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify
      - run: ./mvnw -B verify -P e2e
