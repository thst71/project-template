# Initialises every variant of the template and runs it like a project would. init.sh removes
# this workflow from the projects it creates.
name: template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  variant:
    strategy:
      fail-fast: false
      matrix:
        language: [node, python, go]
        testing: [plain, bdt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./init.sh ${{ matrix.language }} ${{ matrix.testing }} hello-${{ matrix.language }}
      - uses: actions/setup-node@v5
        if: matrix.language == 'node'
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v6
        if: matrix.language == 'python'
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        if: matrix.language == 'go'
        with:
          install-only: true
      - uses: arduino/setup-task@v2
        if: matrix.language == 'go'
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install
        run: |
          case "${{ matrix.language }}" in
            node) npm install && npx playwright install --with-deps chromium ;;
            python) uv sync ;;
            go) go mod download ;;
          esac
      - name: Quality gate
        run: |
          case "${{ matrix.language }}" in
            node) npm run check ;;
            python) uv run poe check ;;
            go) task check ;;
          esac
      - name: Blackbox tests
        run: |
          case "${{ matrix.language }}-${{ matrix.testing }}" in
            node-plain) npm run test:blackbox ;;
            node-bdt) npm run bdt ;;
            python-plain) uv run poe blackbox ;;
            python-bdt) uv run poe bdt ;;
            go-plain) task blackbox ;;
            go-bdt) task bdt ;;
          esac
      - name: BDT reports
        if: matrix.testing == 'bdt'
        run: |
          .agents/skills/spec-system/bin/validate-specs -test-report build/bdt/cucumber.json
          .agents/skills/spec-system/bin/validate-specs -trace-report -results build/bdt/cucumber.json
      - uses: thst71/release-actions/render-docs@7e4daefa8a915c28fd06bcd6f6a5bc77b1f27217 # v0.2.0
        with:
          version: template-${{ github.run_number }}
